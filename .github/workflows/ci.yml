name: FloatSpec CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-trust:
    runs-on: ubuntu-latest
    # About 50-60 min with lean-action's cache warm. A cold GitHub cache no
    # longer rebuilds Mathlib: lean-action downloads Mathlib's prebuilt
    # v4.34.0 oleans (`lake exe cache get`) and elaborates only FloatSpec.
    # Cold, in run 36075003395, lean-action took 15.9 min: 1.6 for the cache,
    # about 8 for FloatSpec, about 5 for the C objects of the Mathlib modules
    # the two executables link, and the whole job 69 min. Before the stable
    # pin a cold lean-action step alone took 73-81 min (runs 35548504304
    # through 35551453076). The required live suite (about 25-31 min) now
    # dominates; the timeout keeps wide headroom.
    timeout-minutes: 180
    steps:
      - name: Initialize fresh cross-check evidence directory
        shell: bash
        run: |
          # Runs before checkout, so the always() upload never sees an unset path.
          # Keep evidence outside lean-action's .lake cache, including on retries.
          output="$RUNNER_TEMP/floatspec-cross-check-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$output"
          echo "FLOCQ_CI_OUTPUT=$output" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that CI runs every check
        shell: bash
        run: |
          # First, so a coverage gap fails in seconds, not after the Lean build.
          # Its own step, whose log the evidence step requires, so switching it
          # off takes a second visible edit there.
          python3 scripts/test_ci_coverage.py -v 2>&1 | tee "$FLOCQ_CI_OUTPUT/ci-coverage.log"

      - name: Install audit prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep opam autoconf automake build-essential libgmp-dev pkg-config
          rg --version
          python3 --version

      - uses: leanprover/lean-action@v1
        with:
          # lean-toolchain and the Mathlib pin are both stable v4.34.0, so
          # Mathlib's prebuilt cache matches this toolchain.
          use-mathlib-cache: true
          build: true
          build-args: FloatSpec.Test FloatSpecTests floatspec floatspec_demo
          # Build inside the action so its GitHub cache saves completed artifacts.

      - name: Cache Rocq toolchain
        id: rocq-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.opam
          key: rocq-${{ runner.os }}-${{ runner.arch }}-9.1.0-stdlib9.0.0-ocaml4.14.1-v1

      - name: Install Rocq and its standard library
        shell: bash
        run: |
          opam init --bare --disable-sandboxing --yes --no-setup
          if ! opam switch list --short | rg -x 'floatspec-rocq'; then
            opam switch create floatspec-rocq ocaml-base-compiler.4.14.1 --yes
          fi
          opam install --switch=floatspec-rocq --yes --jobs=2 coq.9.1.0 rocq-stdlib.9.0.0
          opam exec --switch=floatspec-rocq -- coqc --version

      - name: Save verified Rocq toolchain before long tests
        if: steps.rocq-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.opam
          key: ${{ steps.rocq-cache.outputs.cache-primary-key }}

      - name: Build the pinned Flocq reference
        shell: bash
        run: |
          git submodule update --init Deps/flocq
          test "$(git -C Deps/flocq rev-parse HEAD)" = "$(git rev-parse HEAD:Deps/flocq)"
          opam exec --switch=floatspec-rocq -- bash -euo pipefail -c '
            cd Deps/flocq
            autoreconf -i
            ./configure
            ./remake --jobs=2
          ' 2>&1 | tee "$FLOCQ_CI_OUTPUT/reference-build.log"
          python3 scripts/validate_flocq_source_refs.py Deps/flocq

      - name: Run every Lean regression fixture
        shell: bash
        run: |
          # `lake env lean` ignores the lakefile, so fixtures meet Lean's default
          # linters plus warnings-as-errors, stricter than the product build.
          # Reject what would defeat that, assume a result, fake a run's output,
          # bypass the kernel or rewrite the environment; only ripgrep's explicit
          # no-match result passes. The exemplars run in the required suite
          # below, which needs their special LEAN_PATH, but meet this gate too.
          status=0
          rg -n 'warningAsError|#guard_msgs|#exit|\baxiom\b|implemented_by|\bextern\b|native_decide|decide\s*\+native|native\s*:=\s*true|ofReduceBool|skipKernelTC|addDecl(WithoutChecking|Core)|doCheck|setEnv|modifyEnv|run_(cmd|elab|meta)|sorryAx|drop\s+(all|error|warning)' \
            scripts/fixtures/*.lean scripts/fixtures/exemplars/*.lean || status=$?
          test "$status" -eq 1
          # Discover fixtures by glob so none is left unrun. Those defining `main`
          # also execute, and GuidedDemo runs again as the compiled floatspec_demo;
          # scripts/test_ci_coverage.py checks this list. Each fixture's olean is
          # then replayed through the kernel, since elaboration alone can add a
          # declaration the kernel never checked.
          executable_fixtures=' GuidedDemo PffWalkthrough '
          oleans="$(mktemp -d)"
          for path in scripts/fixtures/*.lean; do
            fixture="$(basename "$path" .lean)"
            echo "== $fixture"
            if [[ "$executable_fixtures" == *" $fixture "* ]]; then
              lake env lean -DwarningAsError=true -o "$oleans/$fixture.olean" --run "$path"
            else
              lake env lean -DwarningAsError=true -o "$oleans/$fixture.olean" "$path"
            fi
          done 2>&1 | tee "$FLOCQ_CI_OUTPUT/lean-fixtures.log"
          lake env lean --run scripts/KernelReplay.lean "$oleans"/*.olean 2>&1 | tee -a "$FLOCQ_CI_OUTPUT/lean-fixtures.log"
          lake exe floatspec_demo 2>&1 | tee -a "$FLOCQ_CI_OUTPUT/lean-fixtures.log"

      - name: Reject proof and semantic placeholders
        shell: bash
        run: |
          scripts/test_audit_placeholders.sh
          python3 scripts/test_scan_failures.py -v
          scripts/test_coq_source_linter.sh
          scripts/test_unused_mvcgen.sh
          python3 scripts/check_proof_debts.py
          python3 scripts/check_compiled_trust.py
          python3 scripts/check_compiled_trust.py --scope tests
          python3 scripts/test_compiled_trust.py -v
          python3 scripts/test_noncomputable_probe.py -v
          python3 scripts/test_flocq_source_refs.py -v
          python3 scripts/test_flocq_port_queue.py -v
          python3 scripts/test_required_rocq_tests.py -v
          python3 scripts/test_reference_policy.py -v
          python3 scripts/flocq_port_queue.py --check-lean-reviews --skip-build

      - name: Report removable noncomputable declarations (report-only)
        shell: bash
        run: |
          # Report-only for now: removable or inconclusive declarations never
          # fail this step. It fails only if the probe cannot vouch for itself
          # (a module it did not load, or a computable control whose copy does
          # not compile). The census is kept with the cross-check evidence.
          python3 scripts/noncomputable_probe.py --skip-build --output "$FLOCQ_CI_OUTPUT/noncomputable" 2>&1 | tee "$FLOCQ_CI_OUTPUT/noncomputable.log"

      - name: Run pure Rocq regressions
        shell: bash
        run: |
          mkdir -p "$FLOCQ_CI_OUTPUT/rocq"
          # Rocq compiles admissions, axioms and aborted checks without error;
          # only ripgrep's explicit no-match result passes. The exemplars compile
          # in the required suite below and meet this gate too.
          status=0
          rg -n '\b(Admitted|Admit|admit|Abort|Axioms?|Parameters?|Conjectures?|Declare)\b|native_compute|native_cast_no_check|Unset (Guard|Positivity|Universe) Checking|bypass_check' \
            scripts/fixtures/*.v scripts/fixtures/exemplars/*.v || status=$?
          test "$status" -eq 1
          # Compile every fixture, discovered by glob, against the pinned build.
          # The loop variables expand in the opam child shell, not this shell.
          # shellcheck disable=SC2016
          opam exec --switch=floatspec-rocq -- bash -euo pipefail -c '
            for path in scripts/fixtures/*.v; do
              fixture="$(basename "$path" .v)"
              echo "== $fixture"
              coqc -q -R Deps/flocq/src Flocq \
                -o "$FLOCQ_CI_OUTPUT/rocq/$fixture.vo" "$path"
            done
          ' 2>&1 | tee "$FLOCQ_CI_OUTPUT/rocq.log"

      - name: Run required live Lean and Rocq mutation tests (no skips)
        shell: bash
        run: |
          opam exec --switch=floatspec-rocq -- python3 scripts/run_required_rocq_tests.py \
            --flocq-dir Deps/flocq --output "$FLOCQ_CI_OUTPUT/required-tests.json" \
            2>&1 | tee "$FLOCQ_CI_OUTPUT/required-tests.log"

      - name: Execute the differential bridge and kernel regressions
        shell: bash
        run: |
          opam exec --switch=floatspec-rocq -- python3 scripts/flocq_bridge.py \
            --flocq-dir Deps/flocq --seed 865509 --samples 5 --batch-size 100 \
            --operations power,div_eucl,location,round,truncate,div,plus,sqrt,formats,digits,operations,bits32,bits64 \
            --skip-build --output "$FLOCQ_CI_OUTPUT/bridge" \
            2>&1 | tee "$FLOCQ_CI_OUTPUT/bridge.log"
          for replay in RawIEEERoundingReplay RawOverflowReplay PrimitiveComparisonReplay PrimitiveConversionReplay; do
            opam exec --switch=floatspec-rocq -- python3 scripts/flocq_bridge.py \
              --flocq-dir Deps/flocq --replay "scripts/fixtures/$replay.json" \
              --skip-build --output "$FLOCQ_CI_OUTPUT/$replay" \
              2>&1 | tee "$FLOCQ_CI_OUTPUT/$replay.log"
          done
          opam exec --switch=floatspec-rocq -- python3 scripts/pff_bridge.py \
            --flocq-dir Deps/flocq --replay scripts/fixtures/PffSignLawsReplay.json \
            --skip-build --output "$FLOCQ_CI_OUTPUT/PffSignLawsReplay" \
            2>&1 | tee "$FLOCQ_CI_OUTPUT/PffSignLawsReplay.log"
          opam exec --switch=floatspec-rocq -- python3 scripts/pff_integer_bridge.py \
            --flocq-dir Deps/flocq --replay scripts/fixtures/PffIntegerReplay.json \
            --skip-build --output "$FLOCQ_CI_OUTPUT/PffIntegerReplay" \
            2>&1 | tee "$FLOCQ_CI_OUTPUT/PffIntegerReplay.log"

      - name: Require complete cross-check evidence
        shell: bash
        run: |
          # A green job must leave the evidence it claims, one .vo per Rocq
          # fixture and one report per replay; name every missing file. The
          # coverage check's log must end in unittest's verdict OK.
          missing=()
          if [[ "$(tail -n 1 "$FLOCQ_CI_OUTPUT/ci-coverage.log" 2>/dev/null)" != OK ]]; then
            missing+=("passing ci-coverage.log")
          fi
          for evidence in reference-build.log lean-fixtures.log rocq.log \
              required-tests.json bridge/report.json; do
            if [[ ! -s "$FLOCQ_CI_OUTPUT/$evidence" ]]; then missing+=("$evidence"); fi
          done
          for path in scripts/fixtures/*.v; do
            evidence="rocq/$(basename "$path" .v).vo"
            if [[ ! -s "$FLOCQ_CI_OUTPUT/$evidence" ]]; then missing+=("$evidence"); fi
          done
          for path in scripts/fixtures/*.json; do
            evidence="$(basename "$path" .json)/report.json"
            if [[ ! -s "$FLOCQ_CI_OUTPUT/$evidence" ]]; then missing+=("$evidence"); fi
          done
          for evidence in "${missing[@]}"; do
            echo "::error::missing cross-check evidence $evidence"
          done
          test "${#missing[@]}" -eq 0

      - name: Preserve cross-check evidence, including failed runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flocq-cross-check-${{ github.sha }}
          path: ${{ env.FLOCQ_CI_OUTPUT }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Verify generated status is current
        shell: bash
        run: |
          scripts/status_report.sh --write
          git diff --exit-code -- FloatSpec/docs/status.json FloatSpec/docs/status.md

      - name: Verify source hygiene
        shell: bash
        run: |
          if [[ -n "${{ github.base_ref }}" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
          test -z "$(git ls-files '.log/**' '.change_log/**' '.subagent_log/**')"
          status=0
          rg -n 'binary_(add|mul|sub|fma|div|sqrt)_correct.*: Unit' FloatSpec || status=$?
          # Only ripgrep's explicit no-match result is a pass, not a tool error.
          test "$status" -eq 1
