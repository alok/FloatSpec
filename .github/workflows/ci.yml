name: FloatSpec CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install audit prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          rg --version
          python3 --version

      - uses: leanprover/lean-action@v1
        with:
          # lean-toolchain selects stable 4.34.0. The reviewed dependency sources
          # remain pinned at rc2, whose prebuilt Mathlib cache is incompatible.
          use-mathlib-cache: false
          build: true
          build-args: FloatSpec.Test FloatSpecTests floatspec
          # Build inside the action so its GitHub cache saves completed artifacts.

      - name: Build regression tests
        run: |
          for fixture in BooleanComparison PrimitiveComparison PrimitiveConversion PrimitiveExecution RawIEEERounding RawOverflow SingleNaNArithmetic SingleNaNHelpers FrexpLaws Normalization CalcBrackets NativeSingleNaNArithmetic MultiplicationErrorGrid DoubleRoundingWitness SingleNaNValidity RelativeErrorGrid ExactArithmeticLaws RoundingOracle IntegerRounding CorePremiseBoundary ExponentValidityBoundary UlpNearestChoiceContracts PffBasicSourceContracts RoundNEPointContracts RemainderContracts RemainderGrid; do
            lake env lean "scripts/fixtures/$fixture.lean"
          done
          lake env lean scripts/fixtures/PffIntegerExecution.lean
          lake env lean scripts/fixtures/ZauxPreludeContracts.lean
          lake env lean scripts/fixtures/ZauxPowerRadixContracts.lean
          lake env lean scripts/fixtures/ZauxDivisionContracts.lean
          lake env lean scripts/fixtures/RoundPredSourceContracts.lean
          lake env lean scripts/fixtures/RoundPredTieContracts.lean
          lake env lean --run scripts/fixtures/GuidedDemo.lean

      - name: Reject proof and semantic placeholders
        run: |
          scripts/test_audit_placeholders.sh
          python3 scripts/test_scan_failures.py -v
          scripts/test_coq_source_linter.sh
          scripts/test_unused_mvcgen.sh
          python3 scripts/check_proof_debts.py
          python3 scripts/check_compiled_trust.py
          python3 scripts/test_compiled_trust.py -v
          python3 scripts/test_flocq_bridge.py -v
          python3 scripts/test_native_ieee_bridge.py -v
          python3 scripts/test_native_arithmetic_bridge.py -v
          python3 scripts/test_ieee_modes_bridge.py -v
          python3 scripts/test_ieee_scale_bridge.py -v
          python3 scripts/test_ieee_integer_bridge.py -v
          python3 scripts/test_flocq_source_refs.py -v
          python3 scripts/test_flocq_port_queue.py -v
          python3 scripts/flocq_port_queue.py --check-lean-reviews --skip-build
          python3 scripts/test_zaux_prelude_bridge.py -v
          python3 scripts/test_zaux_power_contracts.py -v
          python3 scripts/test_zaux_division_contracts.py -v
          python3 scripts/test_round_pred_contracts.py -v
          python3 scripts/test_pff_basic_contracts.py -v
          python3 scripts/test_pff_integer_bridge.py -v
          python3 scripts/test_remainder_contracts.py -v

      - name: Verify generated status is current
        run: |
          scripts/status_report.sh --write
          git diff --exit-code -- FloatSpec/docs/status.json FloatSpec/docs/status.md

      - name: Verify source hygiene
        shell: bash
        run: |
          if [[ -n "${{ github.base_ref }}" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
          test -z "$(git ls-files '.log/**' '.change_log/**' '.subagent_log/**')"
          status=0
          rg -n 'binary_(add|mul|sub|fma|div|sqrt)_correct.*: Unit' FloatSpec || status=$?
          # Only ripgrep's explicit no-match result is a pass, not a tool error.
          test "$status" -eq 1
